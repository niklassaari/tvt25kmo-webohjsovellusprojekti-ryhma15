version: '3.8'

services:
  # Tietokanta nää pitää sit muuttaa kun on se tietokanta tehty
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: moviedb
    ports:
      - "5432:5432"
## ^

#testi, db.sql pitäis nyt mennä läpi
    # Tietokannan data säilyy, vaikka kontti poistetaan.
    volumes:
      - postgres_data:/var/lib/postgresql/data

      # Suorittaa backend/Server/db.sql-tiedoston automaattisesti
      # PostgreSQL:n ensimmäisen alustuksen yhteydessä.
      - ./backend/Server/db.sql:/docker-entrypoint-initdb.d/db.sql

  # Node.js backend
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
       JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
       JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
       FRONTEND_URL: ${FRONTEND_URL}
       PORT: 3001
       DB_HOST: db
       DB_USER: postgres
       DB_PASSWORD: mysecretpassword
       DB_NAME: moviedb
       TMDB_API_KEY: ${TMDB_API_KEY}
    depends_on:
      - db

  # React frontend
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - backend

##testitesti

# Määritellään PostgreSQL:n käyttämä pysyvä volume.
volumes:
  postgres_data:

